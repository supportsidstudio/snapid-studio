<!doctype html>
<html lang="en" class="dark" style="background-color: #020617; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Instant zero-flash theme and background initializer (runs synchronously before CSS/JS) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('snapid_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.backgroundColor = '#f8fafc';
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.backgroundColor = '#020617';
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Critical instant styling: Prevents white flash & blank page freeze -->
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        min-height: 100%;
        -webkit-font-smoothing: antialiased;
      }
      html.light, html.light body {
        background-color: #f8fafc;
        color: #0f172a;
        color-scheme: light;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: inherit;
      }
      #root:empty {
        background-color: #020617;
      }
    </style>

    <!-- Preconnect Google Fonts for faster non-blocking font resolution -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Professional SEO Metadata -->
    <title>SnapID Studio - AI Passport Photo Maker & Document Print Suite</title>
    <meta name="description" content="Free, 100% private, client-side AI tool to generate government-compliant passport photos, visa layouts, and standard Indian document print files (Aadhaar, PAN, Voter ID, DL) with automated background removal." />
    <meta name="keywords" content="passport photo maker, visa photo size, Indian passport photo 35x45, Aadhaar card photo guidelines, PAN card size, AI background removal, print passport photos home, free ID layout, NSDL PAN signature, Schengen visa photo requirements" />
    <meta name="author" content="SnapID Studio" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2563eb" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://snapid.studio/" />
    
    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SnapID Studio - Professional AI Passport Photo & Document Suite" />
    <meta property="og:description" content="Prepare ready-to-print passport size photos, visa sheets, and cropped Indian documents. Background removal runs completely locally and privately on your device." />
    <meta property="og:url" content="https://snapid.studio/" />
    <meta property="og:site_name" content="SnapID Studio" />
    <meta property="og:image" content="https://snapid.studio/assets/og-image.png" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SnapID Studio - AI Passport Photo & Document Suite" />
    <meta name="twitter:description" content="Format, crop, and assemble official ID card layouts and passport photos at home using secure, browser-local AI background extraction." />
    <meta name="twitter:image" content="https://snapid.studio/assets/og-image.png" />
    
    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SnapID Studio",
        "alternateName": "SnapID AI Passport Photo Suite",
        "url": "https://snapid.studio/",
        "description": "A high-performance, privacy-first web application designed to help users crop, adjust, and assemble passport size photographs and standard government documents into printable grid sheets utilizing local machine learning.",
        "applicationCategory": "DesignApplication, Utility",
        "operatingSystem": "All (Web-based: Windows, macOS, Linux, Android, iOS)",
        "browserRequirements": "Requires HTML5, WebAssembly (WASM), and canvas support.",
        "offers": {
          "@type": "Offer",
          "price": "0.00",
          "priceCurrency": "USD"
        },
        "creator": {
          "@type": "Organization",
          "name": "SnapID Studio",
          "url": "https://snapid.studio/"
        },
        "featureList": [
          "Private client-side AI background removal",
          "Official passport size presets (India, USA, UK, Canada, Schengen, OCI)",
          "Print layup grids for A4 and 4x6 photo papers",
          "Standard Indian ID preparator (Aadhaar, PAN Card, Voter ID, Driving Licence)",
          "Double-sided foldable document assembly layouts"
        ]
      }
    </script>
    
    <!-- Favicon link (Standard SVG favicon) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
